<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 96 320 320" width="100%" height="100%">
  <!-- Rounded square badge (320x320 centered, 64px radius = 20% of width) -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="#4F46E5"/>
  
  <!-- Icon Container, rotated 45 degrees for the diagonal chain link -->
  <g transform="translate(256, 256) rotate(-45)" 
     stroke="#FFFFFF" 
     stroke-width="24" 
     stroke-linecap="round" 
     stroke-linejoin="round" 
     fill="none">
     
     <!-- Left Loop -->
     <path d="M -25,40 L -55,40 A 40,40 0 0 1 -55,-40 L -25,-40" />
     
     <!-- Right Loop -->
     <path d="M 25,-40 L 55,-40 A 40,40 0 0 1 55,40 L 25,40" />
     
     <!-- Center Link Line -->
     <line x1="-35" y1="0" x2="35" y2="0" />
  </g>
</svg>
